<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

<main class="mx-auto max-w-4xl px-6 py-8">

    <div class="mb-6">
        <p class="text-sm font-semibold text-emerald-600">
            Administración
        </p>

        <h1 class="text-3xl font-bold text-blue-950">
            Crear usuario
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Registra un nuevo usuario para acceder al sistema.
        </p>
    </div>


    <form method="POST"
          class="rounded-2xl border border-blue-100 bg-white p-6 shadow-sm">

        {% csrf_token %}

        <div class="grid gap-5 md:grid-cols-2">

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Nombre
                </label>

                <input type="text"
                       name="nombre"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Apellidos
                </label>

                <input type="text"
                       name="apellidos"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Usuario
                </label>

                <input type="text"
                       name="username"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Correo
                </label>

                <input type="email"
                       name="email"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Contraseña
                </label>

                <input type="password"
                       name="password"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Rol
                </label>

                <select name="rol"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3">

                    <option value="">Seleccionar rol</option>
                    <option value="administrador">Administrador</option>
                    <option value="fisioterapeuta">Fisioterapeuta</option>
                    <option value="recepcion">Recepción</option>

                </select>
            </div>

        </div>


        <div class="mt-6 flex justify-end gap-3">

            <a href="#"
               class="rounded-xl border border-slate-300 px-6 py-3">
                Cancelar
            </a>

            <button type="submit"
                    class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 font-semibold text-white">
                Crear usuario
            </button>

        </div>

    </form>

</main>

</body>
</html>
