<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="border-b border-blue-100 bg-white">

        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

            <div>
                <h1 class="text-xl font-semibold text-blue-900">
                    Editar usuario
                </h1>

                <p class="text-sm text-slate-500">
                    {{ usuario_seleccionado.username }}
                </p>
            </div>

            <a
                href="{% url 'administracion:detalle_usuario' usuario_seleccionado.id %}"
                class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100"
            >
                Cancelar
            </a>

        </div>

    </header>


    <main class="mx-auto max-w-2xl px-6 py-10">

        <form
            method="POST"
            class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
        >

            {% csrf_token %}

            <div class="space-y-5 p-6">


                <div>

                    <label
                        for="nombre"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Nombre
                    </label>

                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        value="{{ usuario_seleccionado.first_name }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="apellidos"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Apellidos
                    </label>

                    <input
                        id="apellidos"
                        name="apellidos"
                        type="text"
                        value="{{ usuario_seleccionado.last_name }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="email"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Correo electrónico
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        value="{{ usuario_seleccionado.email }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="rol"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Rol
                    </label>

                    <select
                        id="rol"
                        name="rol"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                        {% for valor, nombre in roles %}

                            <option
                                value="{{ valor }}"
                                {% if perfil.rol == valor %}selected{% endif %}
                            >
                                {{ nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="border-t border-slate-200 bg-slate-50 p-6">

                <button
                    type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 text-sm font-semibold text-white hover:from-blue-700 hover:to-emerald-700"
                >
                    Guardar cambios
                </button>

            </div>

        </form>

    </main>

</body>

</html>
