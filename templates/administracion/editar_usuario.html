<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="border-b border-blue-100 bg-white">

        <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-6 py-4">

            <div>
                <h1 class="text-xl font-semibold text-blue-900">
                    Editar usuario
                </h1>

                <p class="text-sm text-slate-500">
                    {{ usuario_seleccionado.username }}
                </p>
            </div>

            <nav aria-label="Navegación de Administración" class="flex flex-wrap items-center justify-end gap-3">

                {% include "componentes/boton_volver_panel.html" %}
            </nav>

        </div>

    </header>


    <main class="mx-auto max-w-2xl px-6 py-10">

        <form
            method="POST"
            class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
        >

            {% csrf_token %}

            <div class="space-y-5 p-6">


                <div>

                    <label
                        for="nombre"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Nombre
                    </label>

                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        value="{{ usuario_seleccionado.first_name }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="apellidos"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Apellidos
                    </label>

                    <input
                        id="apellidos"
                        name="apellidos"
                        type="text"
                        value="{{ usuario_seleccionado.last_name }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="email"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Correo electrónico
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        value="{{ usuario_seleccionado.email }}"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="rol"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Rol
                    </label>

                    <select
                        id="rol"
                        name="rol"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                        {% for valor, nombre in roles %}

                            <option
                                value="{{ valor }}"
                                {% if perfil.rol == valor %}selected{% endif %}
                            >
                                {{ nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>



                <!-- BOTONES INFERIORES DEL FORMULARIO -->
                <div class="border-t border-slate-200 bg-slate-50 p-6">

                    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-end">

                        <!-- CANCELAR -->
                        <a
                            href="{% url 'administracion:detalle_usuario' usuario_seleccionado.id %}"
                            class="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-red-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-red-700 sm:w-auto"
                        >
                            Cancelar
                        </a>

                        <!-- GUARDAR CAMBIOS -->
                        <button
                            type="submit"
                            class="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 text-sm font-semibold text-white transition hover:from-blue-700 hover:to-emerald-700 sm:w-auto"
                        >
                            Guardar cambios
                        </button>

                    </div>

                </div>

            </div>

        </form>

    </main>

</body>

</html>
