<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendar Cita</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<!-- HEADER -->
<header class="border-b border-blue-100 bg-white">

    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

        <div>
            <h1 class="font-semibold text-blue-900">
                Clínica de Fisioterapia
            </h1>

            <p class="text-xs text-slate-400">
                Gestión de citas
            </p>
        </div>

        <a
            href="mis_citas.html"
            class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2 text-sm font-medium text-blue-700 transition hover:bg-blue-100"
        >
            ← Mis citas
        </a>

    </div>

</header>


<!-- CONTENIDO -->
<main class="mx-auto max-w-4xl px-6 py-10">

    <!-- ENCABEZADO -->
    <section class="mb-8">

        <p class="text-sm font-semibold text-emerald-600">
            Reservación
        </p>

        <h2 class="mt-2 text-3xl font-bold text-blue-950">
            Agendar cita
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Ingresa la información requerida para programar una nueva sesión.
        </p>

    </section>


    <!-- FORMULARIO -->
    <form
        method="POST"
        action="#"
        class="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-sm"
    >

        {% csrf_token %}

        <div class="p-6">

            <div class="grid gap-5 sm:grid-cols-2">

                <!-- SERVICIO -->
                <div>

                    <label
                        for="servicio"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Servicio
                    </label>

                    <select
                        id="servicio"
                        name="servicio"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                        <option value="">
                            Selecciona un servicio
                        </option>

                        <option value="valoracion">
                            Valoración inicial
                        </option>

                        <option value="fisioterapia_general">
                            Fisioterapia general
                        </option>

                        <option value="terapia_deportiva">
                            Terapia deportiva
                        </option>

                        <option value="rehabilitacion">
                            Rehabilitación
                        </option>

                    </select>

                </div>


                <!-- FISIOTERAPEUTA -->
                <div>

                    <label
                        for="fisioterapeuta"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Fisioterapeuta
                    </label>

                    <select
                        id="fisioterapeuta"
                        name="fisioterapeuta"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                    >

                        <option value="">
                            Selecciona un fisioterapeuta
                        </option>

                        {% for fisioterapeuta in fisioterapeutas %}

                        <option value="{{ fisioterapeuta.id }}">
                            {{ fisioterapeuta.nombre }}
                            {{ fisioterapeuta.apellidos }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- FECHA -->
                <div>

                    <label
                        for="fecha"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Fecha
                    </label>

                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <!-- MOTIVO -->
                <div>

                    <label
                        for="motivo"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Motivo
                    </label>

                    <select
                        id="motivo"
                        name="motivo"
                        required
                        class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                    >

                        <option value="">
                            Selecciona un motivo
                        </option>

                        <option value="dolor_muscular">
                            Dolor muscular
                        </option>

                        <option value="lesion_deportiva">
                            Lesión deportiva
                        </option>

                        <option value="dolor_lumbar">
                            Dolor lumbar
                        </option>

                        <option value="dolor_cervical">
                            Dolor cervical
                        </option>

                        <option value="valoracion_inicial">
                            Valoración inicial
                        </option>

                        <option value="rehabilitacion">
                            Rehabilitación
                        </option>

                        <option value="otro">
                            Otro
                        </option>

                    </select>

                </div>


                <!-- INFORMACIÓN ADICIONAL -->
                <div class="sm:col-span-2">

                    <label
                        for="informacion_adicional"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Información adicional
                    </label>

                    <textarea
                        id="informacion_adicional"
                        name="informacion_adicional"
                        rows="4"
                        placeholder="Describe brevemente el motivo de consulta..."
                        class="w-full resize-none rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    ></textarea>

                </div>

            </div>

        </div>


        <!-- BOTONES -->
        <div class="border-t border-slate-100 bg-slate-50 px-6 py-5">

            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

                <a
                    href="cita_emergencia.html"
                    class="text-sm font-semibold text-emerald-700 transition hover:text-emerald-800"
                >
                    ¿Necesitas atención prioritaria?
                </a>


                <div class="flex flex-col gap-3 sm:flex-row">

                    <a
                        href="mis_citas.html"
                        class="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-center text-sm font-medium text-slate-700 transition hover:bg-slate-100"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:from-blue-700 hover:to-emerald-700"
                    >
                        Continuar y ver horarios
                    </button>

                </div>

            </div>

        </div>

    </form>

</main>

</body>
</html>
