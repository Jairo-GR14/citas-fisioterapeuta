<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-white">

    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

        <div>
            <h1 class="font-semibold text-blue-800">
                Clínica de Fisioterapia
            </h1>

            <p class="text-xs text-slate-400">
                Nueva cita
            </p>
        </div>

        <a
            href="mis_citas.html"
            class="text-sm text-slate-500 hover:text-blue-700"
        >
            ← Mis citas
        </a>

    </div>

</header>


<main class="mx-auto max-w-4xl px-6 py-10">

    <section class="mb-8">

        <p class="text-sm font-medium text-blue-700">
            Reservación
        </p>

        <h2 class="mt-2 text-3xl font-semibold">
            Agendar cita
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Ingresa la información requerida para programar una nueva sesión.
        </p>

    </section>


    <section class="rounded-2xl border border-slate-200 bg-white p-6">

        <div class="grid gap-5 sm:grid-cols-2">

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Servicio
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona un servicio</option>
                    <option>Valoración inicial</option>
                    <option>Fisioterapia general</option>
                    <option>Terapia deportiva</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Fisioterapeuta
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona un fisioterapeuta</option>
                    <option>Lic. María López</option>
                    <option>Lic. Carlos Hernández</option>
                    <option>Lic. Ana Martínez</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Fecha
                </label>

                <input
                    type="date"
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Motivo
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona un motivo</option>
                    <option>Dolor muscular</option>
                    <option>Lesión deportiva</option>
                    <option>Dolor lumbar</option>
                    <option>Dolor cervical</option>
                    <option>Valoración inicial</option>
                </select>
            </div>


            <div class="sm:col-span-2">
                <label class="mb-2 block text-sm font-medium">
                    Información adicional
                </label>

                <textarea
                    rows="4"
                    placeholder="Describe brevemente tu motivo de consulta..."
                    class="w-full resize-none rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none placeholder:text-slate-400 focus:border-blue-500"
                ></textarea>
            </div>

        </div>


        <div class="mt-7 flex flex-col gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-between">

            <a
                href="cita_emergencia.html"
                class="text-sm font-medium text-emerald-700 hover:text-emerald-800"
            >
                ¿Necesitas atención prioritaria?
            </a>


            <div class="flex gap-3">

                <a
                    href="mis_citas.html"
                    class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm hover:bg-slate-50"
                >
                    Cancelar
                </a>

                <a
                    href="horarios_disponibles.html"
                    class="rounded-xl bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800"
                >
                    Ver horarios
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
