<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-50 px-6 text-slate-900">

<main class="w-full max-w-lg">

    <section class="rounded-2xl border border-slate-200 bg-white p-7">

        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 font-bold text-red-700">
            !
        </div>

        <h1 class="mt-5 text-2xl font-semibold">
            Cancelar cita
        </h1>

        <p class="mt-2 text-sm leading-6 text-slate-500">
            Esta acción cancelará la cita programada para el
            12 de octubre a las 10:30 AM.
        </p>


        <div class="my-6 rounded-xl bg-blue-50 p-4">

            <p class="font-medium text-blue-900">
                Fisioterapia general
            </p>

            <p class="mt-1 text-sm text-blue-700">
                Lic. María López
            </p>

        </div>


        <select class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none">
            <option>Selecciona un motivo</option>
            <option>Cambio de horario</option>
            <option>Problemas personales</option>
            <option>Ya no necesito la cita</option>
            <option>Otro</option>
        </select>


        <div class="mt-6 grid grid-cols-2 gap-3">

            <a
                href="detalle_cita.html"
                class="rounded-xl border border-slate-200 px-4 py-3 text-center text-sm hover:bg-slate-50"
            >
                Conservar cita
            </a>

            <button
                onclick="window.location.href='mis_citas.html'"
                class="rounded-xl bg-red-700 px-4 py-3 text-sm font-medium text-white hover:bg-red-800"
            >
                Cancelar cita
            </button>

        </div>

    </section>

</main>

</body>
</html>
