<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-stone-50 px-6 text-stone-900">

<main class="w-full max-w-lg">

    <section class="rounded-2xl border border-stone-200 bg-white p-7">

        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 text-lg text-red-700">
            !
        </div>

        <h1 class="mt-5 text-2xl font-semibold">
            Cancelar cita
        </h1>

        <p class="mt-2 text-sm leading-6 text-stone-500">
            Estás a punto de cancelar tu cita del 12 de octubre de 2026
            a las 10:30 AM.
        </p>


        <div class="my-6 rounded-xl bg-stone-50 p-4">

            <p class="text-sm font-medium">
                Fisioterapia general
            </p>

            <p class="mt-1 text-xs text-stone-500">
                Lic. María López
            </p>

        </div>


        <label class="mb-2 block text-sm font-medium">
            Motivo de cancelación
        </label>

        <select class="w-full rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none focus:border-stone-400">

            <option>Selecciona un motivo</option>
            <option>Problemas personales</option>
            <option>Cambio de horario</option>
            <option>Ya no necesito la cita</option>
            <option>Otro</option>

        </select>


        <textarea
            rows="3"
            placeholder="Comentario opcional..."
            class="mt-3 w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none placeholder:text-stone-400 focus:border-stone-400"
        ></textarea>


        <div class="mt-6 grid grid-cols-2 gap-3">

            <button class="rounded-xl border border-stone-200 px-4 py-3 text-sm hover:bg-stone-50">
                Conservar cita
            </button>

            <button class="rounded-xl bg-red-700 px-4 py-3 text-sm font-medium text-white hover:bg-red-800">
                Cancelar cita
            </button>

        </div>

    </section>

</main>

</body>
</html>
