<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-stone-50 text-stone-900">

<main class="mx-auto max-w-3xl px-6 py-12">

    <div class="mb-8 text-center">

        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-stone-900 font-semibold text-white">
            CF
        </div>

        <h1 class="mt-5 text-3xl font-semibold">
            Confirma tu cita
        </h1>

        <p class="mt-2 text-sm text-stone-500">
            Revisa los datos antes de finalizar la reservación.
        </p>

    </div>


    <section class="overflow-hidden rounded-2xl border border-stone-200 bg-white">

        <div class="border-b border-stone-100 p-6">

            <div class="flex items-center justify-between">

                <div>
                    <p class="text-sm text-stone-400">
                        Servicio
                    </p>

                    <h2 class="mt-1 text-lg font-semibold">
                        Fisioterapia general
                    </h2>
                </div>

                <span class="rounded-full bg-stone-100 px-3 py-1 text-xs text-stone-600">
                    Por confirmar
                </span>

            </div>

        </div>


        <div class="grid gap-6 p-6 sm:grid-cols-2">

            <div>
                <p class="text-xs text-stone-400">Paciente</p>
                <p class="mt-1 text-sm font-medium">Juan Pérez</p>
            </div>

            <div>
                <p class="text-xs text-stone-400">Fisioterapeuta</p>
                <p class="mt-1 text-sm font-medium">Lic. María López</p>
            </div>

            <div>
                <p class="text-xs text-stone-400">Fecha</p>
                <p class="mt-1 text-sm font-medium">9 de octubre de 2026</p>
            </div>

            <div>
                <p class="text-xs text-stone-400">Hora</p>
                <p class="mt-1 text-sm font-medium">11:00 AM</p>
            </div>

            <div>
                <p class="text-xs text-stone-400">Motivo</p>
                <p class="mt-1 text-sm font-medium">Dolor lumbar</p>
            </div>

            <div>
                <p class="text-xs text-stone-400">Costo estimado</p>
                <p class="mt-1 text-sm font-medium">$350 MXN</p>
            </div>

        </div>


        <div class="flex flex-col gap-3 border-t border-stone-100 bg-stone-50 p-6 sm:flex-row sm:justify-end">

            <button class="rounded-xl border border-stone-200 bg-white px-5 py-2.5 text-sm hover:bg-stone-100">
                Regresar
            </button>

            <button class="rounded-xl bg-stone-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-stone-700">
                Confirmar cita
            </button>

        </div>

    </section>

</main>

</body>
</html>
