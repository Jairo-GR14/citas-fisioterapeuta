<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<main class="mx-auto max-w-3xl px-6 py-10">

    <a
        href="detalle_cita.html"
        class="text-sm text-slate-500 hover:text-blue-700"
    >
        ← Regresar
    </a>

    <h1 class="mt-5 text-3xl font-semibold">
        Editar cita
    </h1>

    <p class="mt-2 text-sm text-slate-500">
        Modifica la información necesaria.
    </p>


    <form class="mt-8 rounded-2xl border border-slate-200 bg-white p-6">

        <div class="grid gap-5 sm:grid-cols-2">

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Fisioterapeuta
                </label>

                <select class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none">
                    <option>Lic. María López</option>
                    <option>Lic. Carlos Hernández</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Servicio
                </label>

                <select class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none">
                    <option>Fisioterapia general</option>
                    <option>Terapia deportiva</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Fecha
                </label>

                <input
                    type="date"
                    value="2026-10-12"
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none"
                >
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Horario
                </label>

                <select class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none">
                    <option>10:30 AM</option>
                    <option>11:00 AM</option>
                </select>
            </div>

        </div>


        <div class="mt-7 flex justify-end gap-3">

            <a
                href="detalle_cita.html"
                class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm hover:bg-slate-50"
            >
                Cancelar
            </a>

            <button
                type="button"
                onclick="window.location.href='detalle_cita.html'"
                class="rounded-xl bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800"
            >
                Guardar cambios
            </button>

        </div>

    </form>

</main>

</body>
</html>
