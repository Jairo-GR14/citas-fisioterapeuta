<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Disponibles</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-white">

    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

        <h1 class="font-semibold text-blue-800">
            Clínica de Fisioterapia
        </h1>

        <a
            href="agendar_cita.html"
            class="text-sm text-slate-500 hover:text-blue-700"
        >
            ← Regresar
        </a>

    </div>

</header>


<main class="mx-auto max-w-5xl px-6 py-10">

    <section class="mb-8">

        <p class="text-sm font-medium text-blue-700">
            Disponibilidad
        </p>

        <h2 class="mt-2 text-3xl font-semibold">
            Selecciona un horario
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Lic. María López · Viernes 9 de octubre
        </p>

    </section>


    <div class="grid gap-6 lg:grid-cols-[1fr_300px]">

        <section class="rounded-2xl border border-slate-200 bg-white p-6">

            <h3 class="mb-5 font-semibold">
                Horarios disponibles
            </h3>

            <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">

                <button
                    class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-4 text-sm text-emerald-700 hover:bg-emerald-100"
                >
                    09:00 AM
                </button>

                <button
                    class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-4 text-sm text-emerald-700 hover:bg-emerald-100"
                >
                    10:00 AM
                </button>

                <button
                    class="rounded-xl bg-blue-700 px-4 py-4 text-sm font-medium text-white"
                >
                    11:00 AM
                </button>

                <button
                    disabled
                    class="cursor-not-allowed rounded-xl bg-slate-100 px-4 py-4 text-sm text-slate-300"
                >
                    12:00 PM
                </button>

                <button
                    class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-4 text-sm text-emerald-700 hover:bg-emerald-100"
                >
                    01:00 PM
                </button>

                <button
                    class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-4 text-sm text-emerald-700 hover:bg-emerald-100"
                >
                    03:00 PM
                </button>

            </div>

        </section>


        <aside class="rounded-2xl bg-blue-700 p-6 text-white">

            <p class="text-xs uppercase tracking-widest text-blue-100">
                Horario seleccionado
            </p>

            <h3 class="mt-5 text-2xl font-semibold">
                11:00 AM
            </h3>

            <p class="mt-3 text-sm text-blue-100">
                Viernes 9 de octubre
            </p>

            <p class="mt-1 text-sm text-blue-200">
                Lic. María López
            </p>


            <a
                href="confirmar_cita.html"
                class="mt-8 block w-full rounded-xl bg-white px-4 py-3 text-center text-sm font-medium text-blue-800 hover:bg-blue-50"
            >
                Continuar
            </a>

        </aside>

    </div>

</main>

</body>
</html>
