<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios disponibles</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-stone-50 text-stone-900">

<header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-stone-900 text-white">
                CF
            </div>

            <span class="font-semibold">
                Clínica de Fisioterapia
            </span>
        </div>

        <a href="#" class="text-sm text-stone-500 hover:text-stone-900">
            Regresar
        </a>

    </div>
</header>


<main class="mx-auto max-w-5xl px-6 py-10">

    <div class="mb-8">
        <p class="text-sm text-stone-400">
            Disponibilidad
        </p>

        <h1 class="mt-2 text-3xl font-semibold">
            Selecciona un horario
        </h1>

        <p class="mt-2 text-sm text-stone-500">
            Lic. María López · Viernes 9 de octubre
        </p>
    </div>


    <div class="grid gap-6 lg:grid-cols-[1fr_300px]">

        <section class="rounded-2xl border border-stone-200 bg-white p-6">

            <h2 class="mb-5 font-semibold">
                Horarios disponibles
            </h2>

            <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">

                <button class="rounded-xl border border-stone-200 px-4 py-4 text-sm hover:border-stone-400 hover:bg-stone-50">
                    09:00 AM
                </button>

                <button class="rounded-xl border border-stone-200 px-4 py-4 text-sm hover:border-stone-400 hover:bg-stone-50">
                    10:00 AM
                </button>

                <button class="rounded-xl bg-stone-900 px-4 py-4 text-sm text-white">
                    11:00 AM
                </button>

                <button disabled class="cursor-not-allowed rounded-xl bg-stone-100 px-4 py-4 text-sm text-stone-300">
                    12:00 PM
                </button>

                <button class="rounded-xl border border-stone-200 px-4 py-4 text-sm hover:border-stone-400 hover:bg-stone-50">
                    01:00 PM
                </button>

                <button class="rounded-xl border border-stone-200 px-4 py-4 text-sm hover:border-stone-400 hover:bg-stone-50">
                    03:00 PM
                </button>

            </div>

        </section>


        <aside class="rounded-2xl bg-stone-900 p-6 text-white">

            <p class="text-xs uppercase tracking-widest text-stone-400">
                Selección
            </p>

            <h2 class="mt-5 text-xl font-semibold">
                11:00 AM
            </h2>

            <p class="mt-3 text-sm text-stone-300">
                Viernes 9 de octubre
            </p>

            <p class="mt-1 text-sm text-stone-400">
                Lic. María López
            </p>

            <button class="mt-8 w-full rounded-xl bg-white px-4 py-3 text-sm font-medium text-stone-900 hover:bg-stone-100">
                Seleccionar horario
            </button>

        </aside>

    </div>

</main>

</body>
</html>
