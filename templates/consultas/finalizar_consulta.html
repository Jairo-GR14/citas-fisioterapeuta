<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar consulta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-stone-50 text-stone-900">

<main class="mx-auto max-w-3xl px-6 py-12">

    <section class="rounded-2xl border border-stone-200 bg-white p-7">

        <div class="mb-7">

            <p class="text-sm text-stone-400">
                Consulta #0024
            </p>

            <h1 class="mt-2 text-2xl font-semibold">
                Finalizar consulta
            </h1>

            <p class="mt-2 text-sm leading-6 text-stone-500">
                Completa la información final antes de cerrar la sesión.
            </p>

        </div>


        <form class="space-y-6">

            <div>

                <label class="mb-2 block text-sm font-medium">
                    Tratamiento realizado
                </label>

                <textarea
                    rows="4"
                    placeholder="Describe el tratamiento aplicado..."
                    class="w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none placeholder:text-stone-400 focus:border-stone-400"
                ></textarea>

            </div>


            <div>

                <label class="mb-2 block text-sm font-medium">
                    Respuesta del paciente
                </label>

                <textarea
                    rows="3"
                    placeholder="Describe la respuesta durante la sesión..."
                    class="w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none placeholder:text-stone-400 focus:border-stone-400"
                ></textarea>

            </div>


            <div>

                <label class="mb-2 block text-sm font-medium">
                    Indicaciones para seguimiento
                </label>

                <textarea
                    rows="4"
                    placeholder="Agrega indicaciones o recomendaciones..."
                    class="w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none placeholder:text-stone-400 focus:border-stone-400"
                ></textarea>

            </div>


            <div class="rounded-xl bg-stone-50 p-4">

                <div class="flex items-center justify-between">

                    <div>
                        <p class="text-sm font-medium">
                            Juan Pérez
                        </p>

                        <p class="mt-1 text-xs text-stone-500">
                            Fisioterapia general · 12 octubre 2026
                        </p>
                    </div>

                    <span class="rounded-full bg-stone-200 px-3 py-1 text-xs text-stone-600">
                        En proceso
                    </span>

                </div>

            </div>


            <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">

                <button
                    type="button"
                    class="rounded-xl border border-stone-200 px-5 py-2.5 text-sm hover:bg-stone-50"
                >
                    Volver
                </button>

                <button
                    type="submit"
                    class="rounded-xl bg-stone-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-stone-700"
                >
                    Finalizar consulta
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
