<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar consulta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-stone-50 text-stone-900">

<header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-stone-900 text-sm font-semibold text-white">
                CF
            </div>

            <div>
                <p class="font-semibold">Clínica de Fisioterapia</p>
                <p class="text-xs text-stone-400">Atención clínica</p>
            </div>
        </div>

        <a href="#" class="text-sm text-stone-500 hover:text-stone-900">
            Regresar a agenda
        </a>

    </div>
</header>


<main class="mx-auto max-w-5xl px-6 py-10">

    <section class="mb-8">
        <p class="text-sm text-stone-400">
            Consulta
        </p>

        <h1 class="mt-2 text-3xl font-semibold tracking-tight">
            Iniciar consulta
        </h1>

        <p class="mt-2 text-sm text-stone-500">
            Registra la información inicial del paciente antes de comenzar la sesión.
        </p>
    </section>


    <div class="grid gap-6 lg:grid-cols-[1fr_300px]">

        <form class="space-y-6">

            <section class="rounded-2xl border border-stone-200 bg-white p-6">

                <h2 class="mb-6 font-semibold">
                    Datos del paciente
                </h2>

                <div class="grid gap-5 sm:grid-cols-2">

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Paciente
                        </label>

                        <input
                            type="text"
                            value="Juan Pérez"
                            readonly
                            class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-600"
                        >
                    </div>


                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Fisioterapeuta
                        </label>

                        <input
                            type="text"
                            value="Lic. María López"
                            readonly
                            class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-600"
                        >
                    </div>


                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Fecha
                        </label>

                        <input
                            type="text"
                            value="12 de octubre de 2026"
                            readonly
                            class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-600"
                        >
                    </div>


                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Hora
                        </label>

                        <input
                            type="text"
                            value="10:30 AM"
                            readonly
                            class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm text-stone-600"
                        >
                    </div>

                </div>

            </section>


            <section class="rounded-2xl border border-stone-200 bg-white p-6">

                <h2 class="mb-6 font-semibold">
                    Evaluación inicial
                </h2>

                <div class="space-y-5">

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Motivo de consulta
                        </label>

                        <textarea
                            rows="3"
                            class="w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none focus:border-stone-400"
                        >Dolor lumbar persistente relacionado con actividad física.</textarea>
                    </div>


                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Nivel de dolor actual
                        </label>

                        <select
                            class="w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm outline-none focus:border-stone-400"
                        >
                            <option>Selecciona un nivel</option>
                            <option>0 - Sin dolor</option>
                            <option>1 - 3 Leve</option>
                            <option>4 - 6 Moderado</option>
                            <option>7 - 10 Intenso</option>
                        </select>
                    </div>


                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Observaciones iniciales
                        </label>

                        <textarea
                            rows="4"
                            placeholder="Describe hallazgos relevantes..."
                            class="w-full resize-none rounded-xl border border-stone-200 px-4 py-3 text-sm outline-none placeholder:text-stone-400 focus:border-stone-400"
                        ></textarea>
                    </div>

                </div>

            </section>


            <div class="flex justify-end">

                <button
                    type="submit"
                    class="rounded-xl bg-stone-900 px-6 py-3 text-sm font-medium text-white hover:bg-stone-700"
                >
                    Iniciar consulta
                </button>

            </div>

        </form>


        <aside class="space-y-4">

            <section class="rounded-2xl bg-stone-900 p-5 text-white">

                <p class="text-xs uppercase tracking-widest text-stone-400">
                    Cita actual
                </p>

                <h2 class="mt-4 text-lg font-semibold">
                    Fisioterapia general
                </h2>

                <p class="mt-2 text-sm text-stone-300">
                    Juan Pérez
                </p>

                <p class="mt-1 text-sm text-stone-400">
                    10:30 AM
                </p>

            </section>


            <section class="rounded-2xl border border-stone-200 bg-white p-5">

                <p class="text-sm font-medium">
                    Estado
                </p>

                <div class="mt-4">
                    <span class="rounded-full bg-stone-100 px-3 py-1 text-xs text-stone-600">
                        Lista para iniciar
                    </span>
                </div>

            </section>

        </aside>

    </div>

</main>

</body>
</html>
