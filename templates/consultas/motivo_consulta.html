<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivo de Consulta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-blue-100 bg-white">

    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">

        <div>

            <h1 class="font-semibold text-blue-900">
                Clínica de Fisioterapia
            </h1>

            <p class="text-xs text-slate-400">
                Valoración inicial
            </p>

        </div>

        <a
            href="iniciar_consulta.html"
            class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100"
        >
            ← Regresar
        </a>

    </div>

</header>


<main class="mx-auto max-w-3xl px-6 py-10">

    <section class="mb-8">

        <p class="text-sm font-semibold text-emerald-600">
            Valoración inicial
        </p>

        <h2 class="mt-2 text-3xl font-bold text-blue-950">
            Motivo de consulta
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Registra la información principal relacionada con el problema del paciente.
        </p>

    </section>


    <form
        method="POST"
        action="#"
        class="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-sm"
    >

        {% csrf_token %}

        <div class="space-y-6 p-6">

            <!-- MOTIVO -->
            <div>

                <label
                    for="motivo"
                    class="mb-2 block text-sm font-semibold text-blue-900"
                >
                    Motivo principal
                </label>

                <select
                    id="motivo"
                    name="motivo"
                    required
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >

                    <option value="">
                        Selecciona un motivo
                    </option>

                    <option value="dolor_muscular">
                        Dolor muscular
                    </option>

                    <option value="lesion_deportiva">
                        Lesión deportiva
                    </option>

                    <option value="dolor_lumbar">
                        Dolor lumbar
                    </option>

                    <option value="dolor_cervical">
                        Dolor cervical
                    </option>

                    <option value="rehabilitacion_postquirurgica">
                        Rehabilitación postquirúrgica
                    </option>

                    <option value="problemas_movilidad">
                        Problemas de movilidad
                    </option>

                    <option value="valoracion_inicial">
                        Valoración inicial
                    </option>

                    <option value="otro">
                        Otro
                    </option>

                </select>

            </div>


            <!-- DOLOR -->
            <div>

                <label
                    for="nivel_dolor"
                    class="mb-2 block text-sm font-semibold text-emerald-700"
                >
                    Nivel de dolor
                </label>

                <select
                    id="nivel_dolor"
                    name="nivel_dolor"
                    required
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                >

                    <option value="">
                        Selecciona un nivel
                    </option>

                    <option value="0">
                        0 - Sin dolor
                    </option>

                    <option value="1-3">
                        1 - 3 Leve
                    </option>

                    <option value="4-6">
                        4 - 6 Moderado
                    </option>

                    <option value="7-10">
                        7 - 10 Intenso
                    </option>

                </select>

            </div>


            <!-- EVOLUCIÓN -->
            <div>

                <label
                    for="tiempo_evolucion"
                    class="mb-2 block text-sm font-semibold text-blue-900"
                >
                    Tiempo de evolución
                </label>

                <select
                    id="tiempo_evolucion"
                    name="tiempo_evolucion"
                    required
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                >

                    <option value="">
                        Selecciona una opción
                    </option>

                    <option value="menos_24h">
                        Menos de 24 horas
                    </option>

                    <option value="1_7_dias">
                        1 a 7 días
                    </option>

                    <option value="1_4_semanas">
                        1 a 4 semanas
                    </option>

                    <option value="mas_1_mes">
                        Más de un mes
                    </option>

                    <option value="recurrente">
                        Problema recurrente
                    </option>

                </select>

            </div>


            <!-- DESCRIPCIÓN -->
            <div>

                <label
                    for="descripcion"
                    class="mb-2 block text-sm font-semibold text-emerald-700"
                >
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    rows="5"
                    required
                    placeholder="Describe síntomas, molestias y antecedentes relevantes..."
                    class="w-full resize-none rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none placeholder:text-slate-400 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
                ></textarea>

            </div>

        </div>


        <!-- BOTONES -->
        <div class="flex flex-col gap-3 border-t border-slate-100 bg-slate-50 p-6 sm:flex-row sm:justify-end">

            <a
                href="iniciar_consulta.html"
                class="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-center text-sm font-medium text-slate-700 hover:bg-slate-100"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-2.5 text-sm font-semibold text-white hover:from-blue-700 hover:to-emerald-700"
            >
                Guardar y continuar
            </button>

        </div>

    </form>

</main>

</body>
</html>
