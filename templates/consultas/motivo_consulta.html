<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivo de Consulta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">

        <h1 class="font-semibold text-blue-800">
            Clínica de Fisioterapia
        </h1>

        <a
            href="iniciar_consulta.html"
            class="text-sm text-slate-500 hover:text-blue-700"
        >
            ← Regresar
        </a>

    </div>
</header>


<main class="mx-auto max-w-3xl px-6 py-10">

    <section class="mb-8">

        <p class="text-sm font-medium text-blue-700">
            Valoración inicial
        </p>

        <h2 class="mt-2 text-3xl font-semibold">
            Motivo de consulta
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Registra la información principal relacionada con el problema del paciente.
        </p>

    </section>


    <section class="rounded-2xl border border-slate-200 bg-white p-6">

        <div class="space-y-5">

            <div>
                <label class="mb-2 block text-sm font-medium">
                    Motivo principal
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona un motivo</option>
                    <option>Dolor muscular</option>
                    <option>Lesión deportiva</option>
                    <option>Dolor lumbar</option>
                    <option>Dolor cervical</option>
                    <option>Rehabilitación postquirúrgica</option>
                    <option>Problemas de movilidad</option>
                    <option>Valoración inicial</option>
                    <option>Otro</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Nivel de dolor
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona un nivel</option>
                    <option>0 - Sin dolor</option>
                    <option>1 - 3 Leve</option>
                    <option>4 - 6 Moderado</option>
                    <option>7 - 10 Intenso</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Tiempo de evolución
                </label>

                <select
                    class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-blue-500"
                >
                    <option>Selecciona una opción</option>
                    <option>Menos de 24 horas</option>
                    <option>1 a 7 días</option>
                    <option>1 a 4 semanas</option>
                    <option>Más de un mes</option>
                    <option>Problema recurrente</option>
                </select>
            </div>


            <div>
                <label class="mb-2 block text-sm font-medium">
                    Descripción
                </label>

                <textarea
                    rows="5"
                    placeholder="Describe síntomas, molestias y antecedentes relevantes..."
                    class="w-full resize-none rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none placeholder:text-slate-400 focus:border-blue-500"
                ></textarea>
            </div>

        </div>


        <div class="mt-7 flex justify-end gap-3">

            <a
                href="iniciar_consulta.html"
                class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm hover:bg-slate-50"
            >
                Cancelar
            </a>

            <a
                href="detalle_consulta.html"
                class="rounded-xl bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800"
            >
                Guardar y continuar
            </a>

        </div>

    </section>

</main>

</body>
</html>
