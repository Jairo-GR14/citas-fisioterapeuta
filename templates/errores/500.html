<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error del Servidor</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

<header class="border-b border-blue-100 bg-white">

    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <div>

            <h1 class="text-xl font-semibold text-blue-900">
                Clínica de Fisioterapia
            </h1>

            <p class="text-sm text-slate-500">
                Sistema
            </p>

        </div>

    </div>

</header>


<main class="mx-auto flex min-h-[75vh] max-w-7xl items-center justify-center px-6 py-8">


    <!-- Contenido del error -->

    <div class="w-full max-w-2xl rounded-2xl border border-blue-100 bg-white p-8 text-center">


        <!-- Codigo -->

        <p class="text-7xl font-bold text-blue-900">
            500
        </p>


        <!-- Estado -->

        <div class="mt-4">

            <span class="rounded-full bg-emerald-50 px-4 py-1.5 text-sm font-semibold text-emerald-700">
                Error interno
            </span>

        </div>


        <!-- Mensaje -->

        <h2 class="mt-6 text-3xl font-bold text-blue-950">
            Ocurrió un problema inesperado
        </h2>

        <p class="mx-auto mt-3 max-w-lg text-sm leading-6 text-slate-500">
            El servidor encontró un error y no pudo completar la solicitud.
        </p>


        <!-- Informacion -->

        <div class="mt-6 rounded-xl bg-slate-50 p-5">

            <p class="text-sm text-slate-600">
                Intenta nuevamente en unos momentos. Si el problema continúa,
                comunícate con el administrador del sistema.
            </p>

        </div>


        <!-- Botones -->

        <div class="mt-6 flex flex-col justify-center gap-3 sm:flex-row">

            <button type="button"
                    onclick="location.reload()"
                    class="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-600">

                Intentar de nuevo

            </button>


            <a href="/"
            class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-2.5 text-sm font-semibold text-white">

                Ir al inicio

            </a>

        </div>

    </div>


</main>

</body>

</html>
