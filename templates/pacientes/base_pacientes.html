
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Pacientes{% endblock %} | Clínica de Fisioterapia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

    <header class="border-b border-blue-100 bg-white">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-4">

            <div>
                <h1 class="text-xl font-bold text-blue-900">
                    Clínica de Fisioterapia
                </h1>
                <p class="text-sm text-slate-500">
                    Gestión de pacientes
                </p>
            </div>

            <a
                href="{% url 'usuarios:redireccion_por_rol' %}"
                class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-2 text-sm font-semibold text-blue-700"
            >
                Volver al panel
            </a>

        </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-10">

        {% if messages %}
            {% for message in messages %}
                <div class="mb-5 rounded-xl border border-blue-100 bg-blue-50 p-4 text-sm text-blue-900">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}

    </main>

</body>
</html>
