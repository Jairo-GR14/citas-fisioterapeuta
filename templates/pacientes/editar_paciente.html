<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar paciente</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-stone-100 text-stone-800">


<main class="mx-auto max-w-4xl p-4 py-8">


    <section class="rounded-xl border border-stone-200 bg-white p-6">


        <h1 class="text-3xl font-semibold">

            Editar paciente

        </h1>


        <p class="mt-2 text-stone-500">

            Actualiza la información registrada.

        </p>


        <form method="POST"
              class="mt-6 grid gap-5 sm:grid-cols-2">

            {% csrf_token %}


            <div>

                <label class="text-sm text-stone-600">
                    Nombre
                </label>

                <input type="text"
                       name="nombre"
                       value="{{ paciente.nombre }}"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="text-sm text-stone-600">
                    Apellidos
                </label>

                <input type="text"
                       name="apellidos"
                       value="{{ paciente.apellidos }}"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="text-sm text-stone-600">
                    Teléfono
                </label>

                <input type="text"
                       name="telefono"
                       value="{{ paciente.telefono }}"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="text-sm text-stone-600">
                    Correo
                </label>

                <input type="email"
                       name="correo"
                       value="{{ paciente.correo }}"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div class="sm:col-span-2">

                <label class="text-sm text-stone-600">
                    Diagnóstico
                </label>

                <textarea name="diagnostico"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">{{ paciente.diagnostico }}</textarea>

            </div>


            <div class="sm:col-span-2">

                <label class="text-sm text-stone-600">
                    Antecedentes
                </label>

                <textarea name="antecedentes"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">{{ paciente.antecedentes }}</textarea>

            </div>


            <div class="sm:col-span-2">

                <label class="text-sm text-stone-600">
                    Observaciones
                </label>

                <textarea name="observaciones"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">{{ paciente.observaciones }}</textarea>

            </div>


            <div class="flex gap-3 sm:col-span-2 sm:justify-end">


                <a href="{% url 'detalle_paciente' paciente.id %}"
                   class="rounded-lg border border-stone-300 px-5 py-2 hover:bg-stone-100">

                    Cancelar

                </a>


                <button type="submit"
                        class="rounded-lg bg-green-600 px-5 py-2 text-white hover:bg-green-700">

                    Guardar cambios

                </button>

            </div>

        </form>

    </section>

</main>

</body>

</html>
