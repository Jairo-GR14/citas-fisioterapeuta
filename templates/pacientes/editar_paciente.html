<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

<main class="mx-auto max-w-5xl px-6 py-8">

    <div class="mb-6">
        <p class="text-sm font-semibold text-emerald-600">
            Actualización de información
        </p>

        <h1 class="text-3xl font-bold text-blue-950">
            Editar paciente
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Modifica la información registrada del paciente.
        </p>
    </div>


    <div class="mb-6 rounded-2xl border border-blue-100 bg-gradient-to-r from-blue-50 to-emerald-50 p-5">

        <h2 class="font-semibold text-blue-950">
            {{ paciente.nombre }} {{ paciente.apellidos }}
        </h2>

        <p class="text-sm text-slate-500">
            Paciente #{{ paciente.id }}
        </p>

    </div>


    <form method="POST"
          class="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-sm">

        {% csrf_token %}

        <section class="border-b border-slate-100 p-6">

            <h3 class="mb-5 text-lg font-semibold text-blue-900">
                Información personal
            </h3>

            <div class="grid gap-5 md:grid-cols-2">

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Nombre
                    </label>

                    <input type="text"
                           name="nombre"
                           value="{{ paciente.nombre }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Apellidos
                    </label>

                    <input type="text"
                           name="apellidos"
                           value="{{ paciente.apellidos }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Fecha de nacimiento
                    </label>

                    <input type="date"
                           name="fecha_nacimiento"
                           value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Sexo
                    </label>

                    <select name="sexo"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3">

                        <option value="{{ paciente.sexo }}">
                            {{ paciente.sexo }}
                        </option>

                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>

                    </select>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Teléfono
                    </label>

                    <input type="tel"
                           name="telefono"
                           value="{{ paciente.telefono }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Correo
                    </label>

                    <input type="email"
                           name="email"
                           value="{{ paciente.email }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div class="md:col-span-2">
                    <label class="mb-2 block text-sm font-medium">
                        Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           value="{{ paciente.direccion }}"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

            </div>

        </section>


        <section class="border-b border-slate-100 p-6">

            <h3 class="mb-5 text-lg font-semibold text-emerald-700">
                Contacto de emergencia
            </h3>

            <div class="grid gap-5 md:grid-cols-2">

                <input type="text"
                       name="contacto_emergencia"
                       value="{{ paciente.contacto_emergencia }}"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">

                <input type="tel"
                       name="telefono_emergencia"
                       value="{{ paciente.telefono_emergencia }}"
                       class="w-full rounded-xl border border-slate-300 px-4 py-3">

            </div>

        </section>


        <section class="p-6">

            <label class="mb-2 block text-sm font-medium">
                Notas
            </label>

            <textarea name="notas"
                      rows="4"
                      class="w-full rounded-xl border border-slate-300 px-4 py-3">{{ paciente.notas }}</textarea>

        </section>


        <div class="flex justify-end gap-3 border-t border-slate-100 bg-slate-50 p-6">

            <a href="#"
               class="rounded-xl border border-slate-300 bg-white px-6 py-3">
                Cancelar
            </a>

            <button type="submit"
                    class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 font-semibold text-white">
                Guardar cambios
            </button>

        </div>

    </form>

</main>

</body>
</html>
