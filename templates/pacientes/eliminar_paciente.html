<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar paciente</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-stone-100 text-stone-800">


<main class="mx-auto flex min-h-screen max-w-xl items-center p-4">


    <section class="w-full rounded-xl border border-red-200 bg-white p-6">


        <h1 class="text-2xl font-semibold text-red-600">

            Eliminar paciente

        </h1>


        <p class="mt-4">

            ¿Estás seguro de que deseas eliminar al paciente

            <strong>
                {{ paciente.nombre }}
                {{ paciente.apellidos }}
            </strong>?

        </p>


        <p class="mt-2 text-sm text-stone-500">

            Esta acción no se puede deshacer.

        </p>


        <form method="POST"
              class="mt-6 flex gap-3">

            {% csrf_token %}


            <a href="{% url 'detalle_paciente' paciente.id %}"
               class="rounded-lg border border-stone-300 px-5 py-2 hover:bg-stone-100">

                Cancelar

            </a>


            <button type="submit"
                    class="rounded-lg bg-red-600 px-5 py-2 text-white hover:bg-red-700">

                Eliminar paciente

            </button>

        </form>

    </section>

</main>

</body>

</html>
