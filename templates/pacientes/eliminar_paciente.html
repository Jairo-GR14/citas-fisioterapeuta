<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dar de Baja</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-stone-100 text-stone-800">


<main class="mx-auto flex min-h-screen max-w-2xl items-center p-4">


    <section class="w-full rounded-xl border border-stone-300 bg-white p-6">


        <h1 class="text-3xl font-semibold">

            Dar de baja paciente

        </h1>


        <p class="mt-4 text-stone-600">

            ¿Deseas dar de baja a

            <strong>

                {{ paciente.nombre }}
                {{ paciente.apellidos }}

            </strong>?

        </p>


        <p class="mt-2 text-sm text-stone-500">

            El historial del paciente se conservara dentro del sistema.

        </p>


        <form method="POST"
              class="mt-6 flex justify-end gap-3">

            {% csrf_token %}


            <a href="{% url 'detalle_paciente' paciente.id %}"
               class="rounded-lg border border-stone-300 px-5 py-2 hover:bg-stone-100">

                Cancelar

            </a>


            <button
                type="submit"
                class="rounded-lg bg-red-600 px-5 py-2 text-white hover:bg-red-700">

                Dar de baja

            </button>

        </form>

    </section>

</main>

</body>

</html>
