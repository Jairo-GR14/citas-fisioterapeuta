<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar paciente</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-stone-100 text-stone-800">


<header class="border-b border-stone-200 bg-white">

    <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">

        <span class="text-lg font-semibold">
            Clínica Fisio
        </span>


        <a href="{% url 'lista_pacientes' %}"
           class="rounded-lg border border-stone-300 px-4 py-2 text-sm hover:bg-stone-100">

            Regresar

        </a>

    </nav>

</header>


<main class="mx-auto max-w-5xl p-4 py-8">


    <section class="rounded-xl border border-stone-200 bg-white p-6">


        <div class="mb-6">

            <h1 class="text-3xl font-semibold">
                Registrar paciente
            </h1>

            <p class="mt-2 text-sm text-stone-500">
                Ingresa la información del nuevo paciente.
            </p>

        </div>


        <form method="POST"
              class="grid gap-5 sm:grid-cols-2">

            {% csrf_token %}


            <div>

                <label class="block text-sm text-stone-600">

                    Nombre

                </label>

                <input type="text"
                       name="nombre"
                       required
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="block text-sm text-stone-600">

                    Apellidos

                </label>

                <input type="text"
                       name="apellidos"
                       required
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="block text-sm text-stone-600">

                    Fecha de nacimiento

                </label>

                <input type="date"
                       name="fecha_nacimiento"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="block text-sm text-stone-600">

                    Teléfono

                </label>

                <input type="tel"
                       name="telefono"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="block text-sm text-stone-600">

                    Correo electrónico

                </label>

                <input type="email"
                       name="correo"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div>

                <label class="block text-sm text-stone-600">

                    Dirección

                </label>

                <input type="text"
                       name="direccion"
                       class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none">

            </div>


            <div class="sm:col-span-2">

                <label class="block text-sm text-stone-600">

                    Diagnóstico

                </label>

                <textarea name="diagnostico"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none"></textarea>

            </div>


            <div class="sm:col-span-2">

                <label class="block text-sm text-stone-600">

                    Antecedentes

                </label>

                <textarea name="antecedentes"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none"></textarea>

            </div>


            <div class="sm:col-span-2">

                <label class="block text-sm text-stone-600">

                    Observaciones

                </label>

                <textarea name="observaciones"
                          rows="3"
                          class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-green-500 focus:outline-none"></textarea>

            </div>


            <div class="flex gap-3 sm:col-span-2 sm:justify-end">

                <a href="{% url 'lista_pacientes' %}"
                   class="rounded-lg border border-stone-300 px-5 py-2 hover:bg-stone-100">

                    Cancelar

                </a>


                <button type="submit"
                        class="rounded-lg bg-green-600 px-5 py-2 text-white hover:bg-green-700">

                    Guardar paciente

                </button>

            </div>

        </form>

    </section>

</main>

</body>

</html>
