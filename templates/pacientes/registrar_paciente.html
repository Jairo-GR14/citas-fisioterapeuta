<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

<header class="border-b border-blue-100 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <div>
            <h1 class="text-xl font-semibold text-blue-900">
                Clínica de Fisioterapia
            </h1>

            <p class="text-sm text-slate-500">
                Gestión de pacientes
            </p>
        </div>

        <a href="#"
           class="rounded-xl border border-blue-200 bg-blue-50 px-5 py-2.5 text-sm font-medium text-blue-700 hover:bg-blue-100">
            Volver a pacientes
        </a>

    </div>
</header>

<main class="mx-auto max-w-5xl px-6 py-8">

    <div class="mb-6">
        <p class="text-sm font-semibold text-emerald-600">
            Nuevo registro
        </p>

        <h1 class="text-3xl font-bold text-blue-950">
            Registrar paciente
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Ingresa la información del nuevo paciente.
        </p>
    </div>


    <form method="POST"
          class="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-sm">

        {% csrf_token %}

        <section class="border-b border-slate-100 p-6">

            <h2 class="text-lg font-semibold text-blue-900">
                Información personal
            </h2>

            <p class="mb-5 mt-1 text-sm text-slate-500">
                Datos generales del paciente.
            </p>

            <div class="grid gap-5 md:grid-cols-2">

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Nombre
                    </label>

                    <input type="text"
                           name="nombre"
                           required
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Apellidos
                    </label>

                    <input type="text"
                           name="apellidos"
                           required
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Fecha de nacimiento
                    </label>

                    <input type="date"
                           name="fecha_nacimiento"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Sexo
                    </label>

                    <select name="sexo"
                            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3">
                        <option value="">Seleccionar</option>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Teléfono
                    </label>

                    <input type="tel"
                           name="telefono"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Correo electrónico
                    </label>

                    <input type="email"
                           name="email"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

                <div class="md:col-span-2">
                    <label class="mb-2 block text-sm font-medium">
                        Dirección
                    </label>

                    <input type="text"
                           name="direccion"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3">
                </div>

            </div>

        </section>


        <section class="border-b border-slate-100 p-6">

            <h2 class="text-lg font-semibold text-emerald-700">
                Contacto de emergencia
            </h2>

            <div class="mt-5 grid gap-5 md:grid-cols-2">

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Nombre del contacto
                    </label>

                    <input type="text"
                           name="contacto_emergencia"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-500">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium">
                        Teléfono de emergencia
                    </label>

                    <input type="tel"
                           name="telefono_emergencia"
                           class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-emerald-500">
                </div>

            </div>

        </section>


        <section class="p-6">

            <label class="mb-2 block text-sm font-medium">
                Notas adicionales
            </label>

            <textarea name="notas"
                      rows="4"
                      class="w-full resize-none rounded-xl border border-slate-300 px-4 py-3 focus:border-blue-500"></textarea>

        </section>


        <div class="flex justify-end gap-3 border-t border-slate-100 bg-slate-50 p-6">

            <a href="#"
               class="rounded-xl border border-slate-300 bg-white px-6 py-3 text-sm font-medium">
                Cancelar
            </a>

            <button type="submit"
                    class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 text-sm font-semibold text-white hover:from-blue-700 hover:to-emerald-700">
                Registrar paciente
            </button>

        </div>

    </form>

</main>

</body>
</html>
