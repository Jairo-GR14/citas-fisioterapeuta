<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar Paciente</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-stone-100 text-stone-800">


    <!-- Barra de navegacion -->

    <header class="bg-white border-b border-stone-200">

        <nav class="mx-auto flex max-w-5xl items-center justify-between p-4">

            <span class="text-lg font-semibold">

                Clinica Fisio

            </span>


            <ul class="hidden gap-6 text-sm sm:flex">

                <li>
                    <a href="#" class="hover:text-green-600">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="{% url 'lista_pacientes' %}"
                       class="text-green-600">
                        Pacientes
                    </a>
                </li>

                <li>
                    <a href="#" class="hover:text-green-600">
                        Fisioterapeutas
                    </a>
                </li>

                <li>
                    <a href="#" class="hover:text-green-600">
                        Administracion
                    </a>
                </li>

            </ul>


            <a href="{% url 'lista_pacientes' %}"
               class="rounded-lg bg-stone-800 px-4 py-2 text-sm text-white hover:bg-stone-700">

                Regresar

            </a>

        </nav>

    </header>


    <main class="mx-auto max-w-5xl space-y-8 p-4 py-8">


        <h1 class="text-3xl font-semibold">

            Registrar Paciente

        </h1>


        <!-- Formulario -->

        <section class="rounded-xl border border-stone-300 bg-white p-6">


            <h2 class="text-xl font-semibold">

                Datos del paciente

            </h2>


            <form method="POST"
                  class="mt-4 grid gap-4 sm:grid-cols-2">

                {% csrf_token %}


                <div>

                    <label class="block text-sm text-stone-600">

                        Nombre

                    </label>

                    <input
                        name="nombre"
                        type="text"
                        required
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div>

                    <label class="block text-sm text-stone-600">

                        Apellidos

                    </label>

                    <input
                        name="apellidos"
                        type="text"
                        required
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div>

                    <label class="block text-sm text-stone-600">

                        Fecha de nacimiento

                    </label>

                    <input
                        name="fecha_nacimiento"
                        type="date"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div>

                    <label class="block text-sm text-stone-600">

                        Telefono

                    </label>

                    <input
                        name="telefono"
                        type="tel"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div>

                    <label class="block text-sm text-stone-600">

                        Correo

                    </label>

                    <input
                        name="correo"
                        type="email"
                        required
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div>

                    <label class="block text-sm text-stone-600">

                        Direccion

                    </label>

                    <input
                        name="direccion"
                        type="text"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none">

                </div>


                <div class="sm:col-span-2">

                    <label class="block text-sm text-stone-600">

                        Diagnostico

                    </label>

                    <textarea
                        name="diagnostico"
                        rows="3"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none"></textarea>

                </div>


                <div class="sm:col-span-2">

                    <label class="block text-sm text-stone-600">

                        Antecedentes

                    </label>

                    <textarea
                        name="antecedentes"
                        rows="3"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none"></textarea>

                </div>


                <div class="sm:col-span-2">

                    <label class="block text-sm text-stone-600">

                        Observaciones

                    </label>

                    <textarea
                        name="observaciones"
                        rows="3"
                        class="mt-1 w-full rounded-lg border border-stone-300 p-2 hover:border-green-500 focus:border-green-500 focus:outline-none"></textarea>

                </div>


                <div class="sm:col-span-2 text-center sm:text-right">

                    <button
                        type="submit"
                        class="rounded-lg bg-green-600 px-5 py-2 text-white hover:bg-green-700">

                        Guardar Paciente

                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
