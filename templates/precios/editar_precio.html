<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Precio</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">

<header class="border-b border-blue-100 bg-white">

    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <div>

            <h1 class="text-xl font-semibold text-blue-900">
                Clínica de Fisioterapia
            </h1>

            <p class="text-sm text-slate-500">
                Precios
            </p>

        </div>


        <a href="#"
        class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-5 py-2.5 text-sm font-semibold text-white">

            Lista de precios

        </a>

    </div>

</header>


<main class="mx-auto max-w-7xl px-6 py-8">


    <!-- Encabezado -->

    <div class="mb-6">

        <p class="text-sm font-semibold text-emerald-600">
            Configuración
        </p>

        <h2 class="text-3xl font-bold text-blue-950">
            Editar precio
        </h2>

        <p class="mt-2 text-sm text-slate-500">
            Modifica la información y el costo del servicio.
        </p>

    </div>


    <!-- Formulario -->

    <div class="rounded-2xl border border-blue-100 bg-white p-6">

        <form method="POST">

            {% csrf_token %}

            <div class="grid gap-6 md:grid-cols-2">


                <!-- Nombre del servicio -->

                <div>

                    <label for="nombre_servicio"
                        class="block text-sm font-semibold text-slate-600">

                        Nombre del servicio

                    </label>

                    <input type="text"
                        id="nombre_servicio"
                        name="nombre_servicio"
                        value="{{ precio.nombre_servicio }}"
                        required
                        class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-700">

                </div>


                <!-- Precio -->

                <div>

                    <label for="precio"
                        class="block text-sm font-semibold text-slate-600">

                        Precio

                    </label>

                    <input type="number"
                        id="precio"
                        name="precio"
                        min="0"
                        step="0.01"
                        value="{{ precio.precio }}"
                        required
                        class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-700">

                </div>


                <!-- Tipo de servicio -->

                <div>

                    <label for="tipo_servicio"
                        class="block text-sm font-semibold text-slate-600">

                        Tipo de servicio

                    </label>

                    <select id="tipo_servicio"
                            name="tipo_servicio"
                            required
                            class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-700">


                        <option value="">
                            Seleccionar tipo
                        </option>


                        <option value="valoracion"
                            {% if precio.tipo_servicio == "valoracion" %}
                                selected
                            {% endif %}>

                            Valoración inicial

                        </option>


                        <option value="general"
                            {% if precio.tipo_servicio == "general" %}
                                selected
                            {% endif %}>

                            Sesión general

                        </option>


                        <option value="especializada"
                            {% if precio.tipo_servicio == "especializada" %}
                                selected
                            {% endif %}>

                            Terapia especializada

                        </option>

                    </select>

                </div>


                <!-- Estado -->

                <div>

                    <label for="estado"
                        class="block text-sm font-semibold text-slate-600">

                        Estado

                    </label>

                    <select id="estado"
                            name="estado"
                            required
                            class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-700">


                        <option value="">
                            Seleccionar estado
                        </option>


                        <option value="activo"
                            {% if precio.estado == "activo" %}
                                selected
                            {% endif %}>

                            Activo

                        </option>


                        <option value="inactivo"
                            {% if precio.estado == "inactivo" %}
                                selected
                            {% endif %}>

                            Inactivo

                        </option>

                    </select>

                </div>


                <!-- Descripcion -->

                <div class="md:col-span-2">

                    <label for="descripcion"
                        class="block text-sm font-semibold text-slate-600">

                        Descripción

                    </label>

                    <textarea id="descripcion"
                            name="descripcion"
                            rows="4"
                            class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-700">{{ precio.descripcion }}</textarea>

                </div>

            </div>


            <!-- Botones -->

            <div class="mt-6 flex justify-end gap-3">

                <a href="#"
                class="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-600">

                    Cancelar

                </a>


                <button type="submit"
                        class="rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-2.5 text-sm font-semibold text-white">

                    Guardar cambios

                </button>

            </div>

        </form>

    </div>


</main>

</body>

</html
