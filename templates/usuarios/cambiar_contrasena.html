<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="border-b border-blue-100 bg-white">

        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">

            <div>
                <h1 class="text-xl font-semibold text-blue-900">
                    Cambiar contraseña
                </h1>

                <p class="text-sm text-slate-500">
                    Seguridad de la cuenta
                </p>
            </div>

            <a
                href="{% url 'usuarios:perfil' %}"
                class="rounded-xl border border-blue-200 bg-blue-50 px-5 py-2.5 text-sm font-medium text-blue-700 hover:bg-blue-100"
            >
                Volver al perfil
            </a>

        </div>

    </header>


    <main class="mx-auto max-w-2xl px-6 py-10">

        <form
            method="POST"
            class="overflow-hidden rounded-2xl border border-blue-100 bg-white shadow-sm"
        >

            {% csrf_token %}

            <div class="space-y-5 p-6">

                {% if formulario.errors %}

                    <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">

                        {{ formulario.errors }}

                    </div>

                {% endif %}


                <div>

                    <label
                        for="id_old_password"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Contraseña actual
                    </label>

                    <input
                        type="password"
                        name="old_password"
                        id="id_old_password"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="id_new_password1"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        name="new_password1"
                        id="id_new_password1"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>


                <div>

                    <label
                        for="id_new_password2"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Confirmar nueva contraseña
                    </label>

                    <input
                        type="password"
                        name="new_password2"
                        id="id_new_password2"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    >

                </div>

            </div>


            <div class="border-t border-slate-100 bg-slate-50 p-6">

                <button
                    type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 px-6 py-3 text-sm font-semibold text-white hover:from-blue-700 hover:to-emerald-700"
                >
                    Cambiar contraseña
                </button>

            </div>

        </form>

    </main>

</body>

</html>
