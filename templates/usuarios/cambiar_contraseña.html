{% extends 'base/base.html' %}

{% block title %}
Cambiar contraseña
{% endblock %}

{% block content %}

<section class="flex min-h-[70vh] items-center justify-center">

    <div class="w-full max-w-md rounded-xl border border-stone-200 bg-white p-6">

        <div class="mb-6 text-center">

            <h1 class="text-2xl font-semibold text-stone-800">
                Cambiar contraseña
            </h1>

            <p class="mt-2 text-sm text-stone-500">
                Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta.
            </p>

        </div>

        <form method="POST" class="space-y-4">

            {% csrf_token %}

            <div>

                <label
                    for="password"
                    class="block text-sm font-medium text-stone-600"
                >
                    Nueva contraseña
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <div>

                <label
                    for="password2"
                    class="block text-sm font-medium text-stone-600"
                >
                    Confirmar nueva contraseña
                </label>

                <input
                    id="password2"
                    name="password2"
                    type="password"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-teal-600 px-4 py-2 text-white hover:bg-teal-700"
            >
                Cambiar contraseña
            </button>

        </form>

        <div class="mt-4 text-center text-sm">

            <a
                href="#"
                class="text-teal-600 hover:underline"
            >
                Volver a iniciar sesión
            </a>

        </div>

    </div>

</section>

{% endblock %}
