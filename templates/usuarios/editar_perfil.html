{% extends 'base/base.html' %}

{% block title %}
Editar perfil
{% endblock %}

{% block content %}

<section class="mx-auto max-w-3xl">

    <div class="rounded-xl border border-stone-200 bg-white p-6">

        <div class="mb-6">

            <h1 class="text-2xl font-semibold text-stone-800">
                Editar perfil
            </h1>

            <p class="mt-2 text-sm text-stone-500">
                Actualiza la información de tu cuenta.
            </p>

        </div>

        <form method="POST" class="grid gap-4 sm:grid-cols-2">

            {% csrf_token %}

            <div>

                <label
                    for="nombre"
                    class="block text-sm font-medium text-stone-600"
                >
                    Nombre
                </label>

                <input
                    id="nombre"
                    name="nombre"
                    type="text"
                    value="{{ user.first_name }}"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <div>

                <label
                    for="apellidos"
                    class="block text-sm font-medium text-stone-600"
                >
                    Apellidos
                </label>

                <input
                    id="apellidos"
                    name="apellidos"
                    type="text"
                    value="{{ user.last_name }}"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <div>

                <label
                    for="correo"
                    class="block text-sm font-medium text-stone-600"
                >
                    Correo electrónico
                </label>

                <input
                    id="correo"
                    name="correo"
                    type="email"
                    value="{{ user.email }}"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <div>

                <label
                    for="telefono"
                    class="block text-sm font-medium text-stone-600"
                >
                    Teléfono
                </label>

                <input
                    id="telefono"
                    name="telefono"
                    type="tel"
                    value="{{ user.telefono }}"
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >

            </div>

            <div class="sm:col-span-2 flex flex-wrap gap-3">

                <button
                    type="submit"
                    class="rounded-lg bg-teal-600 px-5 py-2 text-white hover:bg-teal-700"
                >
                    Guardar cambios
                </button>

                <a
                    href="#"
                    class="rounded-lg border border-stone-300 px-5 py-2 text-stone-700 hover:bg-stone-50"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
