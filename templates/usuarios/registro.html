{% extends 'base/base.html' %}

{% block title %}
Registro
{% endblock %}

{% block content %}

<section class="flex min-h-[70vh] items-center justify-center">

    <div class="w-full max-w-2xl rounded-xl border border-stone-200 bg-white p-6">

        <div class="mb-6 text-center">

            <h1 class="text-2xl font-semibold text-stone-800">
                Crear cuenta
            </h1>

            <p class="mt-2 text-sm text-stone-500">
                Regístrate como paciente en FisioWeb
            </p>

        </div>

        <form method="POST" class="grid gap-4 sm:grid-cols-2">

            {% csrf_token %}

            <div>
                <label
                    for="nombre"
                    class="block text-sm font-medium text-stone-600"
                >
                    Nombre
                </label>

                <input
                    id="nombre"
                    name="nombre"
                    type="text"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="apellidos"
                    class="block text-sm font-medium text-stone-600"
                >
                    Apellidos
                </label>

                <input
                    id="apellidos"
                    name="apellidos"
                    type="text"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="correo"
                    class="block text-sm font-medium text-stone-600"
                >
                    Correo electrónico
                </label>

                <input
                    id="correo"
                    name="correo"
                    type="email"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="telefono"
                    class="block text-sm font-medium text-stone-600"
                >
                    Teléfono
                </label>

                <input
                    id="telefono"
                    name="telefono"
                    type="tel"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="fecha_nacimiento"
                    class="block text-sm font-medium text-stone-600"
                >
                    Fecha de nacimiento
                </label>

                <input
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    type="date"
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="usuario"
                    class="block text-sm font-medium text-stone-600"
                >
                    Usuario
                </label>

                <input
                    id="usuario"
                    name="usuario"
                    type="text"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="password"
                    class="block text-sm font-medium text-stone-600"
                >
                    Contraseña
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div>
                <label
                    for="password2"
                    class="block text-sm font-medium text-stone-600"
                >
                    Confirmar contraseña
                </label>

                <input
                    id="password2"
                    name="password2"
                    type="password"
                    required
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-teal-500 focus:outline-none"
                >
            </div>

            <div class="sm:col-span-2">

                <button
                    type="submit"
                    class="w-full rounded-lg bg-teal-600 px-4 py-2 text-white hover:bg-teal-700"
                >
                    Crear cuenta
                </button>

            </div>

        </form>

        <div class="mt-4 text-center text-sm text-stone-500">

            ¿Ya tienes una cuenta?

            <a
                href="#"
                class="text-teal-600 hover:underline"
            >
                Iniciar sesión
            </a>

        </div>

    </div>

</section>

{% endblock %}
